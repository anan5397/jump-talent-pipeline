name: Sync Talent Pipeline

# Runs the same matching pipeline as prototype/run_sync.ps1 (Windows Task
# Scheduler), but on GitHub's servers instead of a local laptop -- so the
# rejected-candidate -> Talent Matches flow keeps working regardless of
# whether anyone's machine is on.
#
# Requires two repository secrets (Settings > Secrets and variables >
# Actions > New repository secret):
#   GOOGLE_SERVICE_ACCOUNT_JSON  -- the full contents of service_account.json
#   GOOGLE_SPREADSHEET_URL       -- the live sheet's URL

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gspread google-auth python-dotenv

      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run sync
        env:
          GOOGLE_SPREADSHEET_URL: ${{ secrets.GOOGLE_SPREADSHEET_URL }}
        run: python -m src.sheets_bridge
